<!DOCTYPE html>
<html lang="en-US">
    <head>
        <meta charset="UTF-8">
        <title> Receiver Login </title>
        <link rel="stylesheet" href="../Design/receiver.css">
        <script src="../JS/receiver.js"></script>
    </head>
    <body>
        <div class="header"> <h1> FoodLoop </h1> </div>
        <div class="topnav">
            <a href="#" class="logout" onclick="return logout()"> Logout </a>
            <a href="receiver_register.html"> Register </a>
        </div>
        <form onsubmit="return login_data()">
            <fieldset>
                <legend> Receiver Login </legend>
                <table>
                    <tr>
                        <td> <label for="UserName"> User Name: </label> </td>
                        <td> <input type="text" id="UserName" placeholder="Enter User Name"> </td>
                    </tr>
                    <tr>
                        <td> <label for="Password"> Password: </label> </td>
                        <td> <input type="password" id="Password" placeholder="Enter Password"> </td>
                    </tr>
                </table>
                <p id="LoginError"></p>
            </fieldset>
            <input type="submit" id="submit" value="Login">
            <input type="reset" id="reset">
        </form>
        <div class="footer"> FoodLoop</div>
    </body>
</html>
