<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Donor Registration</title>
    <link rel="stylesheet" href="../Design/donor.css">
    <script src="../JS/donor.js"></script>
</head>
<body>
    <div class="header">
        <h1>FoodLoop</h1>
    </div>

    <form id="RegForm" onsubmit="return collect_data()">
        <fieldset>
            <legend>Donor Personal Information</legend>
            <table>
                <tr>
                    <td><label for="FullName">Full Name:</label></td>
                    <td>
                        <input type="text" id="FullName" placeholder="Enter Your Name">
                        <p id="NameError"></p>
                    </td>
                </tr>
                <tr>
                    <td><label for="Area">Area:</label></td>
                    <td>
                        <select id="Area">
                            <option value="">-------------</option>
                            <option value="Dhaka">Dhaka</option>
                            <option value="Chattogram">Chattogram</option>
                            <option value="Sylhet">Sylhet</option>
                            <option value="Khulna">Khulna</option>
                        </select>
                        <p id="AreaError"></p>
                    </td>
                </tr>
                <tr>
                    <td><label for="Address">Address:</label></td>
                    <td>
                        <textarea id="Address" placeholder="Enter Your Address"
                            rows="5" cols="30" style="resize:none"></textarea>
                    </td>
                </tr>
                <tr>
                    <td><label>Food Type:</label></td>
                    <td>
                        <input type="checkbox" id="Extra1" name="extra" value="Prepared food"> Prepared food
                        <input type="checkbox" id="Extra2" name="extra" value="Raw ingredients"> Raw ingredients
                        <input type="checkbox" id="Extra3" name="extra" value="Packaged food"> Packaged food
                        <p id="ExtraError"></p>
                    </td>
                </tr>
            </table>
        </fieldset>

        <fieldset>
            <legend>User Profile</legend>
            <table>
                <tr>
                    <td><label for="UserName">User Name:</label></td>
                    <td>
                        <input type="text" id="UserName" placeholder="Enter User Name">
                        <p id="UserError"></p>
                    </td>
                </tr>
                <tr>
                    <td><label for="Password">Password:</label></td>
                    <td>
                        <input type="password" id="Password" placeholder="Enter Password">
                        <p id="PassError"></p>
                    </td>
                </tr>
            </table>
        </fieldset>

        <p id="Message"></p>
        <input type="submit" id="submit" value="Signup">
        <input type="reset" id="reset">
    </form>

    <div class="footer">FoodLoop</div>
</body>
</html>
