<!DOCTYPE html>
<html lang="en-US">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title> Donor Dashboard </title>
        <link rel="stylesheet" href="../Design/donor.css">
        <script src="../JS/donor.js"></script>
    </head>
    <body onload="show_dashboard()">
        <div class="header"> <h1> FoodLoop </h1> <h3> Donor Panel </h3> </div>
        <div class="topnav">
            <a href="donor_dashboard.html"> Dashboard </a>
            <a href="#"> Post Food </a>
            <a href="#"> My Donations </a>
            <a href="#"> Pickup Requests </a>
            <a href="#"> My Profile </a>
        </div>
        <h2 id="WelcomeText"></h2>
        <fieldset>
            <legend> Donor Summary </legend>
            <table>
                <tr> <td> Total Donations: </td> <td> 0 </td> </tr>
                <tr> <td> Pending Pickups: </td> <td> 0 </td> </tr>
                <tr> <td> Food Delivered: </td> <td> 0 </td> </tr>
            </table>
        </fieldset>
        <fieldset>
            <legend> My Profile </legend>
            <table>
                <tr> <td> Email: </td> <td id="ProfileEmail"></td> </tr>
                <tr> <td> Area: </td> <td id="ProfileArea"></td> </tr>
                <tr> <td> Food Type: </td> <td id="ProfileExtra"></td> </tr>
                <tr> <td> Account Status: </td> <td id="ProfileStatus"></td> </tr>
            </table>
        </fieldset>
        <footer class="footer"><a href="index.html">FoodLoop</a></footer>
    </body>
</html>
