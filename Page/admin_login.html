<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <title>Admin Login - FoodLoop</title>
    <link rel="stylesheet" href="../Design/admin.css">
</head>

<body>

    <div class="header">
        <h1>FoodLoop</h1>
        <h3>Admin Login</h3>
    </div>

    <form onsubmit="return login_data()" novalidate>

        <fieldset>
            <legend>Admin Login Information</legend>

            <table>

                <tr>
                    <td>Username:</td>
                    <td>
                        <input type="text" id="UserName"
                        placeholder="Enter your username">

                        <p id="LoginUsernameError" class="error"></p>
                    </td>
                </tr>

                <tr>
                    <td>Password:</td>
                    <td>
                        <input type="password" id="Password"
                        placeholder="Enter your password">

                        <p id="LoginPasswordError" class="error"></p>
                    </td>
                </tr>

                <tr>
                    <td colspan="2" align="center">
                        <input type="submit" value="Login">
                        <input type="reset" value="Reset">
                    </td>
                </tr>

            </table>

            <p id="LoginMessage"></p>

        </fieldset>

    </form>

    <p class="page-link">
        Don't have an Admin account?
        <a href="admin_register.html">Register Here</a>
    </p>

    <div class="footer">
        <p>FoodLoop - A Food Sharing and Waste Reduction Platform</p>
    </div>

    <script src="../JS/admin.js"></script>

</body>
</html>
